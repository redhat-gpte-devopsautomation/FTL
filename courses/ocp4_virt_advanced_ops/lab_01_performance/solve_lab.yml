---
# Lab 01: Performance, Scalability, and Troubleshooting - Solver
# Automates completion of Module 1 tasks for OpenShift Virtualization Advanced Operations

- name: Solve Lab 01 - Performance and Scalability
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tags:
    - solve_lab_01_performance

  tasks:
    # Task 1.2: Scale loadmaker deployment to generate load
    - name: Set REQUESTS_PER_SECOND=75 on loadmaker deployment
      ansible.builtin.command:
        cmd: oc set env deployment/loadmaker REQUESTS_PER_SECOND=75 -n webapp-vms
      register: r_loadmaker_patch
      changed_when: "'updated" in r_loadmaker_patch.stdout'

    - name: Wait for loadmaker deployment to roll out
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: loadmaker
        namespace: webapp-vms
      register: r_loadmaker_status
      until:
        - r_loadmaker_status.resources[0].status.updatedReplicas is defined
        - r_loadmaker_status.resources[0].status.updatedReplicas == r_loadmaker_status.resources[0].status.replicas
      retries: 30
      delay: 2

    # Task 1.5: Start winweb02 VM for horizontal scaling
    - name: Start VM winweb02
      ansible.builtin.command:
        cmd: virtctl start winweb02 -n webapp-vms
      register: r_start_winweb02
      failed_when: false
      changed_when: "'Successfully' in r_start_winweb02.stdout or r_start_winweb02.rc == 0"

    - name: Wait for winweb02 to reach Running state
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: winweb02
        namespace: webapp-vms
      register: r_winweb02_status
      until:
        - r_winweb02_status.resources[0].status.printableStatus is defined
        - r_winweb02_status.resources[0].status.printableStatus == "Running"
      retries: 60
      delay: 5

    # Task 1.6: Vertically scale VMs by adding CPUs
    - name: Patch winweb01 to increase CPU to 4 cores
      ansible.builtin.command:
        cmd: oc patch vm winweb01 -n webapp-vms --type=json -p='[{"op":"replace","path":"/spec/template/spec/domain/cpu/cores","value":4}]'
      register: r_winweb01_cpu
      changed_when: "'patched" in r_winweb01_cpu.stdout'

    - name: Patch winweb02 to increase CPU to 4 cores
      ansible.builtin.command:
        cmd: oc patch vm winweb02 -n webapp-vms --type=json -p='[{"op":"replace","path":"/spec/template/spec/domain/cpu/cores","value":4}]'
      register: r_winweb02_cpu
      changed_when: "'patched" in r_winweb02_cpu.stdout'

    # Task 1.8: Start all VMs in mass-vms namespace
    - name: Get all VMs in mass-vms namespace
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        namespace: mass-vms
      register: r_mass_vms

    - name: Start all VMs in mass-vms namespace
      ansible.builtin.command:
        cmd: virtctl start {{ item.metadata.name }} -n mass-vms
      loop: "{{ r_mass_vms.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      register: r_start_mass_vms
      failed_when: false
      changed_when: true

    # Task 1.8: Remove taint from worker node 6 to allow VM scheduling
    - name: Get worker node 6 name
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
      register: r_nodes

    - name: Identify worker node 6
      set_fact:
        worker_node_6: "{{ r_nodes.resources | selectattr('metadata.name', 'search', 'worker-6') | map(attribute='metadata.name') | first }}"

    - name: Remove taint from worker node 6
      ansible.builtin.command:
        cmd: oc adm taint node {{ worker_node_6 }} node.kubernetes.io/unschedulable-
      register: r_untaint_node6
      when: worker_node_6 is defined
      failed_when: false
      changed_when: "'untainted' in r_untaint_node6.stdout or 'not found' not in r_untaint_node6.stderr"

    # Task 1.9: Remove taint from worker node 7 for load balancing
    - name: Identify worker node 7
      set_fact:
        worker_node_7: "{{ r_nodes.resources | selectattr('metadata.name', 'search', 'worker-7') | map(attribute='metadata.name') | first }}"

    - name: Remove taint from worker node 7
      ansible.builtin.command:
        cmd: oc adm taint node {{ worker_node_7 }} node.kubernetes.io/unschedulable-
      register: r_untaint_node7
      when: worker_node_7 is defined
      failed_when: false
      changed_when: "'untainted' in r_untaint_node7.stdout or 'not found' not in r_untaint_node7.stderr"

    # Task 1.9: Scale down loadmaker deployments to complete lab
    - name: Scale loadmaker-1 through loadmaker-12 to 0 replicas
      ansible.builtin.command:
        cmd: oc scale deployment/loadmaker-{{ item }} --replicas=0 -n mass-vms
      loop: "{{ range(1, 13) | list }}"
      register: r_scale_loadmaker
      failed_when: false
      changed_when: "'scaled' in r_scale_loadmaker.stdout"

    - name: Lab 01 Performance solver completed
      debug:
        msg: |
          Lab 01 Performance and Scalability tasks completed:
          ✓ Loadmaker deployment scaled to 75 requests/second
          ✓ VM winweb02 started (horizontal scaling)
          ✓ VMs winweb01 and winweb02 scaled to 4 vCPUs (vertical scaling)
          ✓ All VMs in mass-vms namespace started
          ✓ Worker nodes 6 and 7 taints removed
          ✓ Loadmaker deployments scaled down to 0 replicas
